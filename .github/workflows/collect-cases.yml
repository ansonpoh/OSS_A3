# Snapshot historical upstream issues as golden-case inputs (read-only on upstream).
# Each dispatch pushes its results to a new branch,
# data/cases-<run id>-<attempt> (never a force-push). The committed golden
# inputs in evals/golden/ came from running the same script locally.
name: collect-cases
on:
  workflow_dispatch:
    inputs:
      repo:
        default: Textualize/rich
      issues:
        description: comma-separated issue numbers
        required: true
permissions:
  contents: write  # only to push results to a new data/cases-<run id>-<attempt> branch
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ inputs.repo }}
          ISSUES: ${{ inputs.issues }}
        run: |
          cd scripts/metrics
          python collect_cases.py --repo "$REPO" --issues "$ISSUES" \
            --out ../../evals/golden/cases --index ../../data/issues_index.json
      - name: Commit results to a new data/cases-<run id>-<attempt> branch
        env:
          ISSUES: ${{ inputs.issues }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "data/cases-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git add -f evals/golden/cases data/issues_index.json
          git commit -m "cases: snapshot $ISSUES (run $GITHUB_RUN_ID)"
          # A scratch snapshot (the reviewed copy is on main), one branch per attempt.
          git push origin "HEAD:refs/heads/data/cases-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
