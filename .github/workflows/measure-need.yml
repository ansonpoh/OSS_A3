# Reproducible measurement of triage need on the upstream project (read-only).
# Each dispatch pushes its results to a new branch,
# data/metrics-<run id>-<attempt> (never a force-push). The committed copy in
# evals/metrics/ came from running the same script locally (same arguments).
name: measure-need
on:
  workflow_dispatch:
    inputs:
      repo:
        default: Textualize/rich
      since:
        default: "2025-10-01"
      until:
        default: "2026-10-01"
permissions:
  contents: write  # only to push results to a new data/metrics-<run id>-<attempt> branch
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Measure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ inputs.repo }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
        # Inputs go through env, never interpolated into the script.
        run: |
          python scripts/metrics/triage_metrics.py --repo "$REPO" \
            --since "$SINCE" --until "$UNTIL" --out evals/metrics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: triage-metrics
          path: evals/metrics/
      - name: Commit results to a new data/metrics-<run id>-<attempt> branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "data/metrics-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git add -f evals/metrics
          git commit -m "metrics: $REPO $SINCE..$UNTIL (run $GITHUB_RUN_ID)"
          # A scratch snapshot (the reviewed copy is on main), one branch per attempt.
          git push origin "HEAD:refs/heads/data/metrics-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        env:
          REPO: ${{ inputs.repo }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
