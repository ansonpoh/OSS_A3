# Free checks of the triage configuration on every change to it (no model
# calls): unit tests for the skill scripts, the policy gate and the canaries,
# the skill-use check of every committed run's trace against its engine
# transcript, and the policy gate replayed over every committed output.
name: skill-tests
on:
  push:
    paths: [".claude/skills/**", "evals/**", ".github/triage/**", ".github/workflows/*.md", ".github/workflows/skill-tests.yml"]
  pull_request:
    paths: [".claude/skills/**", "evals/**", ".github/triage/**", ".github/workflows/*.md", ".github/workflows/skill-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Skill script tests
        run: python -m pytest evals/tests -q
      - name: Skill use in committed runs
        run: python evals/verify_skill_use.py
      - name: Policy gate over committed outputs
        run: python evals/gate_replay.py
